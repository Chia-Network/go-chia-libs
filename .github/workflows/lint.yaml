name: Test/Lint/Fmt/Vet
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: golang:1
    steps:
      - name: Add safe Git directory
        uses: Chia-Network/actions/git-mark-workspace-safe@main

      - uses: actions/checkout@v7

      - name: Get latest chiavdf libs
        run: |
          apt-get update && apt-get install -y unzip libgmp-dev
          mkdir chiavdfc
          cd chiavdfc || exit 1
          curl -fsSL -D /tmp/chiavdf-headers -o chiavdfc-ubuntu-intel.zip \
            https://github.com/Chia-Network/chiavdf/releases/latest/download/chiavdfc-ubuntu-intel.zip
          LATEST_CHIAVDF=$(sed -n 's#^[Ll]ocation: .*/download/\([^/]*\)/.*#\1#p' /tmp/chiavdf-headers | head -n 1)
          echo "Latest chiavdf is: $LATEST_CHIAVDF"
          unzip chiavdfc-ubuntu-intel.zip
          echo "CGO_CFLAGS=-I${GITHUB_WORKSPACE}/chiavdfc/chiavdfc-ubuntu-intel" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L${GITHUB_WORKSPACE}/chiavdfc/chiavdfc-ubuntu-intel/static" >> "$GITHUB_ENV"

      - name: Test
        run: make test
